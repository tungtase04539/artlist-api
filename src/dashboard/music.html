<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>音乐生成 · Studio</title>
<style>
  :root{
    --bg:#0a0d14; --panel:#131826; --elev:#1a2132; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#e8ecf5; --mut:#8b94a7; --acc1:#a855f7; --acc2:#ec4899; --grn:#34d399; --red:#f87171; --amber:#fbbf24;
    --grad:linear-gradient(135deg,#a855f7,#ec4899);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(168,85,247,.16),transparent 60%),
    radial-gradient(1000px 600px at -10% 10%,rgba(236,72,153,.12),transparent 55%),var(--bg);
    color:var(--fg);min-height:100%;-webkit-font-smoothing:antialiased;padding-bottom:82px}
  a{color:#e0b3ff;text-decoration:none}
  .wrap{max-width:1240px;margin:auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:rgba(10,13,20,.6);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .dot{width:26px;height:26px;border-radius:8px;background:var(--grad);box-shadow:0 4px 18px rgba(168,85,247,.5);display:flex;align-items:center;justify-content:center;font-size:14px}
  .spacer{margin-left:auto}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--elev);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
  .pill b{color:#fff}
  .iconbtn{background:var(--elev);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
  .iconbtn:hover{border-color:var(--line2)}
  main{padding:22px 0 60px}
  .grid{display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card h3{margin:0 0 14px;font-size:14px;letter-spacing:.3px;color:#fff;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;font-weight:500}
  input,select,textarea{width:100%;background:#0d1220;color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(236,72,153,.18)}
  textarea{min-height:96px;resize:vertical;line-height:1.6}
  textarea.lyrics{min-height:150px}
  /* mode tabs */
  .tabs{display:flex;gap:6px;background:#0d1220;border:1px solid var(--line2);border-radius:12px;padding:4px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);transition:.15s}
  .tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(168,85,247,.35)}
  .switch{display:flex;align-items:center;justify-content:space-between;background:#0d1220;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:6px}
  .sw{position:relative;width:42px;height:24px;border-radius:999px;background:#39415a;cursor:pointer;transition:background .2s;flex:0 0 auto}
  .sw.on{background:var(--acc2)} .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}.sw.on::after{left:21px}
  .est{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;padding:12px 14px;border-radius:12px;background:rgba(236,72,153,.1);border:1px solid rgba(236,72,153,.25)}
  .est .n{font-size:20px;font-weight:800}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(168,85,247,.35);transition:transform .1s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.55;cursor:default;box-shadow:none;filter:grayscale(.3)}
  .muted{color:var(--mut);font-size:12px}
  .row{display:flex;gap:10px}
  .hide{display:none!important}
  .cc{font-size:11px;color:var(--mut);float:right}
  /* song list */
  .songs{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .song{display:flex;gap:12px;align-items:center;background:var(--elev);border:1px solid var(--line);border-radius:14px;padding:10px;transition:border-color .15s}
  .song:hover{border-color:var(--acc2)}
  .cover{width:60px;height:60px;border-radius:10px;flex:0 0 auto;background:#0b0f1a center/cover no-repeat;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .cover .pbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer;opacity:0;transition:.15s}
  .song:hover .cover .pbtn,.cover .pbtn.show{opacity:1}
  .cover.spin::before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sinfo{flex:1;min-width:0}
  .stitle{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stags{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .sact{display:flex;gap:8px;align-items:center;flex:0 0 auto}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .t-done{background:rgba(52,211,153,.15);color:var(--grn)} .t-proc{background:rgba(251,191,36,.15);color:var(--amber)} .t-fail{background:rgba(248,113,113,.15);color:var(--red)}
  .dl{color:var(--mut);cursor:pointer;font-size:16px}.dl:hover{color:#fff}
  .empty{text-align:center;padding:30px;color:var(--mut)}
  /* gate */
  .gate{max-width:440px;margin:8vh auto;text-align:center}
  .gate .card{padding:30px}
  .gate .dot{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;font-size:22px}
  .gate h2{margin:0 0 6px;font-size:20px}
  /* mini player */
  #player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(16,20,32,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line2);transform:translateY(100%);transition:transform .25s}
  #player.on{transform:none}
  .pwrap{max-width:1240px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
  .pcover{width:48px;height:48px;border-radius:8px;background:#0b0f1a center/cover no-repeat;flex:0 0 auto}
  .pmeta{min-width:0;flex:0 0 auto;width:180px}
  .pmeta .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #player audio{flex:1;height:38px}
  /* toast */
  #toasts{position:fixed;right:18px;bottom:92px;z-index:50;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--elev);border:1px solid var(--line2);border-left:3px solid var(--acc2);border-radius:10px;padding:12px 14px;font-size:13px;max-width:320px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .2s ease}
  .toast.err{border-left-color:var(--red)} .toast.ok{border-left-color:var(--grn)}
  @keyframes tin{from{opacity:0;transform:translateX(20px)}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand"><div class="dot">🎵</div>音乐生成 · Studio</div>
  <div class="spacer"></div>
  <span class="pill" id="creditPill" style="display:none">💎 <b id="credits">–</b> 积分</span>
  <a class="pill" href="/app" target="_blank">视频</a>
  <a class="pill" href="/guide" target="_blank">文档</a>
  <button class="iconbtn" id="logoutBtn" style="display:none" onclick="disconnect()">退出</button>
</div></header>

<main class="wrap">
  <!-- Gate -->
  <div id="gate" class="gate">
    <div class="card">
      <div class="dot">🎵</div>
      <h2>连接到音乐生成 API</h2>
      <p class="muted">粘贴你的 API Key 即可开始用 Suno 生成歌曲</p>
      <input id="keyInput" type="password" placeholder="alk_xxxxxxxx..." style="margin-top:14px" onkeydown="if(event.key==='Enter')connect()" />
      <button class="btn" style="margin-top:12px" onclick="connect()">连接</button>
      <p class="muted" style="margin-top:14px">没有 Key？请联系服务商 · <a href="/guide" target="_blank">查看文档</a></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="grid hide">
    <!-- Create -->
    <section class="card">
      <h3>✨ 创建歌曲</h3>
      <div class="tabs">
        <div class="tab on" id="tabSimple" onclick="setMode('simple')">简单模式</div>
        <div class="tab" id="tabCustom" onclick="setMode('custom')">自定义</div>
      </div>

      <!-- simple -->
      <div id="paneSimple">
        <label>歌曲描述 <span class="cc" id="ccDesc">0/500</span></label>
        <textarea id="desc" maxlength="500" placeholder="描述你想要的歌曲，例如：一首关于日出与追梦的温暖独立流行乐，木吉他，励志" oninput="cc('desc','ccDesc',500)"></textarea>
        <div class="switch"><span class="muted" id="instLabel">纯音乐（无人声）：关闭</span>
          <div class="sw" id="instSw" onclick="toggleInst()"></div></div>
      </div>

      <!-- custom -->
      <div id="paneCustom" class="hide">
        <label>标题（可选） <span class="cc" id="ccTitle">0/80</span></label>
        <input id="title" maxlength="80" placeholder="Sunrise Lines" oninput="cc('title','ccTitle',80)" />
        <label>歌词 <span class="cc" id="ccLyrics">0/5000</span></label>
        <textarea id="lyrics" class="lyrics" maxlength="5000" placeholder="[Verse 1]&#10;I walk the line between two lives&#10;[Chorus]&#10;Hold on, the sunrise is calling" oninput="cc('lyrics','ccLyrics',5000)"></textarea>
        <label>风格标签 <span class="cc" id="ccTags">0/1000</span></label>
        <input id="tags" maxlength="1000" placeholder="indie pop, emotional, cinematic drums" oninput="cc('tags','ccTags',1000)" />
        <label>人声</label>
        <select id="vocal"><option value="">默认</option><option value="f">女声</option><option value="m">男声</option></select>
        <p class="muted" style="margin-top:8px">歌词或风格标签至少填一项。</p>
      </div>

      <div class="est"><span class="muted">每次生成（含 2 首）</span><span class="n" id="estN">– 积分</span></div>
      <button class="btn" id="genBtn" onclick="generate()"><span>生成歌曲</span></button>
    </section>

    <!-- Library -->
    <section class="card">
      <h3>🎧 我的歌曲 <button class="iconbtn" style="margin-left:auto;padding:5px 10px;font-size:12px" onclick="loadHistory()">刷新</button></h3>
      <div class="songs" id="songs"></div>
      <div class="empty" id="empty">还没有歌曲，去左边创建第一首吧 🎶</div>
    </section>
  </div>
</main>

<!-- mini player -->
<div id="player"><div class="pwrap">
  <div class="pcover" id="pCover"></div>
  <div class="pmeta"><div class="t" id="pTitle">—</div><div class="muted" id="pSub"></div></div>
  <audio id="audio" controls></audio>
</div></div>
<div id="toasts"></div>

<script>
const $=(s)=>document.querySelector(s);
let KEY=localStorage.getItem('clientKey')||'';
let MODE='simple', INST=false, PRICE=0, HISTORY=[], polling=new Set();

function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'content-type':'application/json','x-api-key':KEY,...(opts.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const fmtTime=(t)=>t?new Date(Number(t)).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const tagFor=(s)=>s==='done'?'<span class="tag t-done">完成</span>':s==='failed'?'<span class="tag t-fail">失败</span>':'<span class="tag t-proc">生成中</span>';
function cc(id,ccId,max){$('#'+ccId).textContent=($('#'+id).value.length)+'/'+max;}

/* ---- connect ---- */
$('#keyInput').value=KEY;
function showApp(on){$('#gate').classList.toggle('hide',on);$('#app').classList.toggle('hide',!on);$('#creditPill').style.display=on?'inline-flex':'none';$('#logoutBtn').style.display=on?'inline-block':'none';}
async function connect(){
  KEY=($('#keyInput').value||KEY).trim(); if(!KEY) return toast('请输入 API Key','err');
  localStorage.setItem('clientKey',KEY);
  try{
    const me=await api('/v1/me'); $('#credits').textContent=me.credits.toLocaleString();
    try{ const p=await api('/v1/music/price'); PRICE=p.credits; $('#estN').textContent=PRICE.toLocaleString()+' 积分'; }
    catch{ $('#estN').textContent='—'; toast('音乐服务未开启','err'); }
    showApp(true); await loadHistory();
  }catch(e){ toast(e.message,'err'); }
}
function disconnect(){KEY='';localStorage.removeItem('clientKey');showApp(false);}
async function refreshCredits(){try{const me=await api('/v1/me');$('#credits').textContent=me.credits.toLocaleString();}catch{}}

/* ---- mode ---- */
function setMode(m){MODE=m;$('#tabSimple').classList.toggle('on',m==='simple');$('#tabCustom').classList.toggle('on',m==='custom');$('#paneSimple').classList.toggle('hide',m!=='simple');$('#paneCustom').classList.toggle('hide',m!=='custom');}
function toggleInst(){INST=!INST;$('#instSw').classList.toggle('on',INST);$('#instLabel').textContent='纯音乐（无人声）：'+(INST?'开启':'关闭');}

/* ---- generate ---- */
async function generate(){
  let body;
  if(MODE==='simple'){
    const prompt=$('#desc').value.trim(); if(!prompt) return toast('请填写歌曲描述','err');
    body={mode:'simple',prompt,instrumental:INST};
  }else{
    const lyrics=$('#lyrics').value.trim(),tags=$('#tags').value.trim();
    if(!lyrics&&!tags) return toast('自定义模式需填写歌词或风格标签','err');
    body={mode:'custom'};
    if($('#title').value.trim())body.title=$('#title').value.trim();
    if(lyrics)body.lyrics=lyrics; if(tags)body.tags=tags;
    if($('#vocal').value)body.vocalGender=$('#vocal').value;
  }
  $('#genBtn').disabled=true;$('#genBtn').querySelector('span').textContent='提交中…';
  try{
    const job=await api('/v1/music',{method:'POST',body:JSON.stringify(body)});
    toast('已提交，扣 '+job.credits+' 积分','ok');
    HISTORY.unshift(job); renderSongs(); refreshCredits(); poll(job.jobId);
  }catch(e){ toast('生成失败：'+e.message,'err'); }
  finally{ $('#genBtn').disabled=false;$('#genBtn').querySelector('span').textContent='生成歌曲'; }
}
async function poll(id){
  if(polling.has(id))return; polling.add(id);
  const tick=async()=>{
    try{
      const j=await api('/v1/music/'+id);
      const idx=HISTORY.findIndex(h=>h.jobId===id); if(idx>=0)HISTORY[idx]=j; else HISTORY.unshift(j); renderSongs();
      if(j.status==='pending'||j.status==='processing'){setTimeout(tick,5000);return;}
      polling.delete(id); refreshCredits();
      if(j.status==='failed')toast('生成失败（已退还积分）','err'); else toast('歌曲生成完成 ✅','ok');
    }catch(e){ setTimeout(tick,6000); }
  };
  tick();
}

/* ---- render ---- */
async function loadHistory(){ try{ HISTORY=await api('/v1/music'); renderSongs(); HISTORY.forEach(j=>{if(j.status==='pending'||j.status==='processing')poll(j.jobId);}); }catch(e){ toast(e.message,'err'); } }
function renderSongs(){
  $('#empty').style.display=HISTORY.length?'none':'block';
  const rows=[];
  HISTORY.forEach((j,ji)=>{
    const urls=(j.audioUrls&&j.audioUrls.length)?j.audioUrls:(j.audioUrl?[j.audioUrl]:[]);
    const title=j.title||(j.mode==='custom'?'自定义歌曲':'AI 歌曲');
    if(j.status==='done'&&urls.length){
      urls.forEach((u,ti)=>rows.push(songRow({
        cover:j.imageUrl,title:urls.length>1?`${title} · 版本${ti+1}`:title,
        sub:`${j.credits}积分 · ${fmtTime(j.createdAt)}`,url:u,status:'done'
      })));
    }else{
      rows.push(songRow({cover:j.imageUrl,title,sub:(j.status==='failed'?(j.error||'失败'):'生成中…通常 1-3 分钟')+' · '+fmtTime(j.createdAt),
        url:j.streamUrl||'',status:j.status,tagHtml:tagFor(j.status)}));
    }
  });
  $('#songs').innerHTML=rows.join('');
}
function songRow({cover,title,sub,url,status,tagHtml}){
  const coverStyle=cover?`background-image:url('${cover}')`:'';
  const playable=!!url;
  const play=status==='done'||url
    ? `<div class="pbtn ${status==='done'?'':'show'}" onclick='playTrack(${JSON.stringify(url)},${JSON.stringify(title)},${JSON.stringify(cover||"")})'>▶</div>`
    : (status==='processing'||status==='pending'?'':'');
  const spin=(status==='processing'||status==='pending')?' spin':'';
  const right=status==='done'
    ? `<span class="dl" title="下载" onclick='dl(${JSON.stringify(url)})'>⬇</span>`
    : (tagHtml||tagFor(status));
  return `<div class="song">
    <div class="cover${spin}" style="${coverStyle}">${play}</div>
    <div class="sinfo"><div class="stitle">${esc(title)}</div><div class="stags">${esc(sub)}</div></div>
    <div class="sact">${right}</div>
  </div>`;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---- player ---- */
function playTrack(url,title,cover){
  if(!url)return toast('暂无可播放音频','err');
  const a=$('#audio'); a.src=url; a.play().catch(()=>{});
  $('#pTitle').textContent=title||'播放中';
  $('#pSub').textContent='正在播放';
  $('#pCover').style.backgroundImage=cover?`url('${cover}')`:'';
  $('#player').classList.add('on');
}
function dl(url){ if(!url)return; const a=document.createElement('a'); a.href=url; a.download=''; a.target='_blank'; a.click(); }

/* ---- boot ---- */
showApp(!!KEY); if(KEY) connect();
</script>
</body>
</html>
