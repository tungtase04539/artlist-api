<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>视频生成 · Studio</title>
<style>
  :root{
    --bg:#0a0d14; --panel:#131826; --elev:#1a2132; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --fg:#e8ecf5; --mut:#8b94a7; --acc1:#6d5efc; --acc2:#3b82f6; --grn:#34d399; --red:#f87171; --amber:#fbbf24;
    --grad:linear-gradient(135deg,#6d5efc,#3b82f6);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(109,94,252,.14),transparent 60%),
    radial-gradient(1000px 600px at -10% 10%,rgba(59,130,246,.12),transparent 55%),var(--bg);
    color:var(--fg);min-height:100%;-webkit-font-smoothing:antialiased}
  a{color:#a9b6ff;text-decoration:none}
  .wrap{max-width:1240px;margin:auto;padding:0 20px}
  /* top bar */
  header{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:rgba(10,13,20,.6);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
  .dot{width:26px;height:26px;border-radius:8px;background:var(--grad);box-shadow:0 4px 18px rgba(109,94,252,.5)}
  .spacer{margin-left:auto}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--elev);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px}
  .pill b{color:#fff}
  .iconbtn{background:var(--elev);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
  .iconbtn:hover{border-color:var(--line2)}
  /* layout */
  main{padding:22px 0 60px}
  .grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card h3{margin:0 0 14px;font-size:14px;letter-spacing:.3px;color:#fff;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px;font-weight:500}
  input,select,textarea{width:100%;background:#0d1220;color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  textarea{min-height:110px;resize:vertical;line-height:1.6}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat}
  .settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .settings .full{grid-column:1/-1}
  .switch{display:flex;align-items:center;justify-content:space-between;background:#0d1220;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;margin-top:6px}
  .sw{position:relative;width:42px;height:24px;border-radius:999px;background:#39415a;cursor:pointer;transition:background .2s;flex:0 0 auto}
  .sw.on{background:var(--acc2)} .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}.sw.on::after{left:21px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--elev);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;max-width:100%}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  .chip b{cursor:pointer;color:var(--mut)}
  .est{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;padding:12px 14px;border-radius:12px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)}
  .est .n{font-size:20px;font-weight:800}
  .btn{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(109,94,252,.35);transition:transform .1s,filter .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.55;cursor:default;box-shadow:none;filter:grayscale(.3)}
  .muted{color:var(--mut);font-size:12px}
  .row{display:flex;gap:10px}
  .ghost{background:var(--elev);border:1px solid var(--line2);color:var(--fg);border-radius:10px;padding:11px 12px;cursor:pointer;font:inherit}
  /* preview */
  .preview{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0b0f1a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
  .preview video{width:100%;height:100%;object-fit:contain;background:#000}
  .ph{color:var(--mut);text-align:center;padding:20px}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,15,26,.8)}
  .spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc2);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar2{width:70%;height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
  .bar2::after{content:"";display:block;height:100%;width:40%;border-radius:999px;background:var(--grad);animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
  .resultmeta{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .t-done{background:rgba(52,211,153,.15);color:var(--grn)} .t-proc{background:rgba(251,191,36,.15);color:var(--amber)} .t-fail{background:rgba(248,113,113,.15);color:var(--red)}
  /* history */
  .hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
  .hcard{background:var(--elev);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .1s}
  .hcard:hover{border-color:var(--acc2);transform:translateY(-2px)}
  .hthumb{aspect-ratio:16/9;background:#0b0f1a center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;position:relative}
  .hthumb .play{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .hmeta{padding:8px 10px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
  /* gate */
  .gate{max-width:440px;margin:8vh auto;text-align:center}
  .gate .card{padding:30px}
  .gate .dot{width:44px;height:44px;border-radius:12px;margin:0 auto 14px}
  .gate h2{margin:0 0 6px;font-size:20px}
  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--elev);border:1px solid var(--line2);border-left:3px solid var(--acc2);border-radius:10px;padding:12px 14px;font-size:13px;max-width:320px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .2s ease}
  .toast.err{border-left-color:var(--red)} .toast.ok{border-left-color:var(--grn)}
  @keyframes tin{from{opacity:0;transform:translateX(20px)}}
  .hide{display:none!important}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand"><div class="dot"></div>视频生成 · Studio</div>
  <div class="spacer"></div>
  <span class="pill" id="creditPill" style="display:none">💎 <b id="credits">–</b> 积分</span>
  <a class="pill" href="/pricing" target="_blank">价格</a>
  <a class="pill" href="/guide" target="_blank">文档</a>
  <button class="iconbtn" id="logoutBtn" style="display:none" onclick="disconnect()">退出</button>
</div></header>

<main class="wrap">
  <!-- Gate -->
  <div id="gate" class="gate">
    <div class="card">
      <div class="dot"></div>
      <h2>连接到视频生成 API</h2>
      <p class="muted">粘贴你的 API Key 即可开始生成视频</p>
      <input id="keyInput" type="password" placeholder="alk_xxxxxxxx..." style="margin-top:14px" onkeydown="if(event.key==='Enter')connect()" />
      <button class="btn" style="margin-top:12px" onclick="connect()">连接</button>
      <p class="muted" style="margin-top:14px">没有 Key？请联系服务商 · <a href="/pricing" target="_blank">查看价格</a></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="grid hide">
    <!-- Create -->
    <section class="card">
      <h3>✨ 创建视频</h3>
      <label>模型</label>
      <select id="model" onchange="onModel()"></select>
      <label>提示词 <span class="muted" id="pcount" style="float:right">0</span></label>
      <textarea id="prompt" placeholder="描述你想要的视频画面，例如：a red panda skateboarding on a neon street, cinematic" oninput="onPrompt()"></textarea>
      <div id="settings" class="settings"></div>
      <label>参考图 URL（可选，图生视频）</label>
      <div class="row"><input id="imgUrl" placeholder="https://example.com/1.jpg" onkeydown="if(event.key==='Enter'){addImg();event.preventDefault();}" /><button class="ghost" onclick="addImg()">添加</button></div>
      <div class="chips" id="imgChips"></div>
      <div class="est"><span class="muted">预估消耗</span><span class="n" id="estN">– 积分</span></div>
      <button class="btn" id="genBtn" onclick="generate()"><span>生成视频</span></button>
    </section>

    <!-- Results -->
    <section>
      <div class="card">
        <h3>🎬 结果</h3>
        <div class="preview" id="preview"><div class="ph" id="ph">生成的视频会显示在这里</div></div>
        <div class="resultmeta" id="resultMeta"></div>
      </div>
      <div class="card" style="margin-top:20px">
        <h3>🗂️ 历史 <button class="iconbtn" style="margin-left:auto;padding:5px 10px;font-size:12px" onclick="loadHistory()">刷新</button></h3>
        <div class="hist" id="hist"></div>
        <div class="muted" id="histEmpty" style="text-align:center;padding:16px">暂无记录</div>
      </div>
    </section>
  </div>
</main>
<div id="toasts"></div>

<script>
const $=(s)=>document.querySelector(s);
let KEY=localStorage.getItem('clientKey')||'';
let MODELS=[], PARAMS=[], IMAGES=[], estTimer=null, HISTORY=[];

function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200);}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'content-type':'application/json','x-api-key':KEY,...(opts.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
const fmtTime=(t)=>t?new Date(Number(t)).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const tagFor=(s)=>s==='done'?'<span class="tag t-done">完成</span>':s==='failed'?'<span class="tag t-fail">失败</span>':'<span class="tag t-proc">生成中</span>';

/* ---- connect ---- */
$('#keyInput').value=KEY;
function showApp(on){$('#gate').classList.toggle('hide',on);$('#app').classList.toggle('hide',!on);$('#creditPill').style.display=on?'inline-flex':'none';$('#logoutBtn').style.display=on?'inline-block':'none';}
async function connect(){
  KEY=($('#keyInput').value||KEY).trim(); if(!KEY) return toast('请输入 API Key','err');
  localStorage.setItem('clientKey',KEY);
  try{
    const me=await api('/v1/me'); $('#credits').textContent=me.credits.toLocaleString();
    const {models}=await api('/v1/models'); MODELS=models;
    $('#model').innerHTML=models.map(m=>`<option value="${m.slug}">${m.name}</option>`).join('');
    if(models.find(m=>m.slug==='seedance-2.0')) $('#model').value='seedance-2.0';
    showApp(true); await onModel(); await loadHistory();
  }catch(e){ toast(e.message,'err'); }
}
function disconnect(){KEY='';localStorage.removeItem('clientKey');showApp(false);}
async function refreshCredits(){try{const me=await api('/v1/me');$('#credits').textContent=me.credits.toLocaleString();}catch{}}

/* ---- model + dynamic settings ---- */
async function onModel(){
  const slug=$('#model').value;
  $('#settings').innerHTML='<div class="muted full">加载参数…</div>';
  try{
    const m=await api('/v1/models/'+slug); PARAMS=m.params||[];
    renderSettings();
  }catch(e){ $('#settings').innerHTML=''; toast('读取模型参数失败: '+e.message,'err'); }
  estimate();
}
function renderSettings(){
  const box=$('#settings'); box.innerHTML='';
  for(const p of PARAMS){
    if(p.component==='dropdown_list' && p.options?.length){
      const def=(p.options.find(o=>o.default)||p.options[0]).value;
      const el=document.createElement('div');
      el.innerHTML=`<label>${labelZh(p.name,p.displayName)}</label>
        <select data-pname="${p.name}" data-ptype="${p.type}" onchange="estimate()">
        ${p.options.map(o=>`<option value="${o.value}"${o.value===def?' selected':''}>${o.label}</option>`).join('')}</select>`;
      box.appendChild(el);
    }else if(p.component==='toggle'){
      const on=(p.options?.find(o=>o.default)?.value)==='true';
      const el=document.createElement('div');el.className='full';
      el.innerHTML=`<label>${labelZh(p.name,p.displayName)}</label>
        <div class="switch"><span class="muted">${on?'开启':'关闭'}</span>
        <div class="sw ${on?'on':''}" data-pname="${p.name}" data-ptype="boolean" data-on="${on}" onclick="toggleSw(this)"></div></div>`;
      box.appendChild(el);
    }
  }
  if(!box.children.length) box.innerHTML='<div class="muted full">该模型无附加参数</div>';
}
function labelZh(name,disp){const m={resolution:'分辨率',duration:'时长（秒）',aspect_ratio:'画面比例',generate_audio:'生成音频'};return m[name]||disp||name;}
function toggleSw(el){const on=el.getAttribute('data-on')!=='true';el.setAttribute('data-on',on);el.classList.toggle('on',on);el.previousElementSibling.textContent=on?'开启':'关闭';estimate();}
function collectSettings(){
  const s={};
  document.querySelectorAll('#settings [data-pname]').forEach(el=>{
    const n=el.getAttribute('data-pname'),t=el.getAttribute('data-ptype');
    let v=el.tagName==='SELECT'?el.value:(el.getAttribute('data-on')==='true');
    if(t==='number') v=Number(v);
    s[n]=v;
  });
  return s;
}

/* ---- images ---- */
function addImg(){const u=$('#imgUrl').value.trim();if(!u)return;if(IMAGES.length>=9)return toast('最多 9 张','err');IMAGES.push(u);$('#imgUrl').value='';renderImgs();}
function renderImgs(){$('#imgChips').innerHTML=IMAGES.map((u,i)=>`<div class="chip"><span>${u}</span><b onclick="IMAGES.splice(${i},1);renderImgs()">✕</b></div>`).join('');}

/* ---- prompt ---- */
function onPrompt(){$('#pcount').textContent=$('#prompt').value.length;estimate();}

/* ---- estimate (debounced) ---- */
function estimate(){clearTimeout(estTimer);estTimer=setTimeout(doEstimate,450);}
async function doEstimate(){
  const s=collectSettings();
  const q=new URLSearchParams({model:$('#model').value});
  if(s.resolution)q.set('resolution',s.resolution);
  if(s.duration!=null)q.set('duration',s.duration);
  if(s.aspect_ratio)q.set('aspectRatio',s.aspect_ratio);
  if(s.generate_audio!=null)q.set('generateAudio',s.generate_audio);
  $('#estN').textContent='计算中…';
  try{const r=await api('/v1/quote?'+q.toString());$('#estN').textContent=r.credits.toLocaleString()+' 积分';}
  catch{$('#estN').textContent='—';}
}

/* ---- generate ---- */
async function generate(){
  const prompt=$('#prompt').value.trim(); if(!prompt) return toast('请填写提示词','err');
  const body={model:$('#model').value,prompt,settings:collectSettings()};
  if(IMAGES.length)body.images=[...IMAGES];
  $('#genBtn').disabled=true;$('#genBtn').querySelector('span').textContent='提交中…';
  try{
    const job=await api('/v1/videos',{method:'POST',body:JSON.stringify(body)});
    toast('已提交，扣 '+job.credits+' 积分','ok');
    HISTORY.unshift({...job}); renderHistory(); showProcessing(job);
    refreshCredits(); poll(job.jobId);
  }catch(e){ toast('生成失败：'+e.message,'err'); }
  finally{ $('#genBtn').disabled=false;$('#genBtn').querySelector('span').textContent='生成视频'; }
}
function showProcessing(job){
  $('#ph').classList.add('hide');
  $('#preview').innerHTML=`<div class="ph hide"></div><div class="loading"><div class="spinner"></div><div class="bar2"></div><div class="muted">正在生成…通常几十秒到几分钟</div></div>`;
  $('#resultMeta').innerHTML=tagFor('processing')+`<span class="muted">${job.credits} 积分 · ${fmtTime(job.createdAt)}</span>`;
}
function showResult(job){
  if(job.status==='done'&&job.videoUrl){
    $('#preview').innerHTML=`<video controls autoplay muted src="${job.videoUrl}"></video>`;
    $('#resultMeta').innerHTML=tagFor('done')+`<a class="ghost" style="padding:6px 12px" href="${job.videoUrl}" target="_blank">下载</a><span class="muted">${job.credits} 积分</span>`;
  }else if(job.status==='failed'){
    $('#preview').innerHTML=`<div class="ph">❌ 生成失败<br><span class="muted">${job.error||''}（积分已退还）</span></div>`;
    $('#resultMeta').innerHTML=tagFor('failed');
  }
}
async function poll(id){
  try{
    const j=await api('/v1/videos/'+id);
    const idx=HISTORY.findIndex(h=>h.jobId===id); if(idx>=0)HISTORY[idx]=j; renderHistory();
    if(j.status==='processing'){setTimeout(()=>poll(id),4000);return;}
    showResult(j); refreshCredits();
    if(j.status==='failed')toast('生成失败（已退还积分）','err'); else toast('生成完成 ✅','ok');
  }catch(e){ setTimeout(()=>poll(id),5000); }
}

/* ---- history ---- */
async function loadHistory(){
  try{ HISTORY=await api('/v1/videos'); renderHistory(); }catch(e){ toast(e.message,'err'); }
}
function renderHistory(){
  const el=$('#hist');
  $('#histEmpty').style.display=HISTORY.length?'none':'block';
  el.innerHTML=HISTORY.map((j,i)=>`<div class="hcard" onclick="openHist(${i})">
    <div class="hthumb" style="${j.thumbnailUrl?`background-image:url('${j.thumbnailUrl}')`:''}">${j.thumbnailUrl?'<div class="play">▶</div>':(j.status==='processing'?'⏳':'—')}</div>
    <div class="hmeta">${tagFor(j.status)}<span>${j.credits}积分</span></div>
  </div>`).join('');
}
function openHist(i){ const j=HISTORY[i]; if(!j)return; if(j.status==='processing'){showProcessing(j);poll(j.jobId);} else {showResult(j);window.scrollTo({top:0,behavior:'smooth'});} }

/* ---- boot ---- */
showApp(!!KEY); if(KEY) connect();
</script>
</body>
</html>
